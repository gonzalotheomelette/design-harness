# The Method page on theomelette.ca reads this repo when the site builds: the latest version, the releases, the numbers
# and the file tree. A release tag redeploys the site so the page follows. Releases come in bursts (13 on Oct 31), so a
# run waits ten minutes and a newer tag cancels the wait: one deploy per burst, which keeps Vercel's build storage and
# this repo's Actions minutes small. The hook only rebuilds what is already on the site's main branch.
# Needs the repository secret VERCEL_DEPLOY_HOOK (Vercel, the site's project, Settings, Git, Deploy Hooks); without it
# the run says so and does nothing.
name: site-redeploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-redeploy
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the burst to settle
        if: github.event_name == 'push'
        run: sleep 600
      - name: Call the site's deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set, so the site was not redeployed."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "The site is rebuilding with ${GITHUB_REF_NAME}."
