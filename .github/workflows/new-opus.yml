# Once a week, reads the newest Opus from Anthropic's public models page. The reviewer runs on the `opus` alias, so a
# new Opus starts reviewing as soon as Claude Code picks it up, with no benchmark behind it. When the newest Opus is not
# the one in bench/opus-benchmarked.txt, this opens one issue asking for the benchmark to be rerun on it. It reads the
# public page rather than the models API so that it needs no API key and no separate billing.
name: new-opus

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          PAGE: https://platform.claude.com/docs/en/about-claude/models/overview.md
        run: |
          set -euo pipefail
          id=$(curl -fsSL "$PAGE" | grep -o 'claude-opus-[0-9][0-9a-z-]*' | sort -uV | tail -1 || true)
          if [ -z "$id" ]; then
            echo "::error::$PAGE names no Opus model. The page has changed; update this check."
            exit 1
          fi
          benched=$(tr -d '[:space:]' < bench/opus-benchmarked.txt)
          echo "Newest Opus: $id. Benchmarked: $benched."
          if [ "$id" = "$benched" ]; then
            exit 0
          fi
          title="Benchmark the reviewer on $id"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$open" != "0" ]; then
            echo "An issue is already open: $title"
            exit 0
          fi
          cat > body.md <<EOF
          \`$id\` is the newest Opus on Anthropic's models page. The reviewer runs on the \`opus\` alias, so it reviews with this model as soon as Claude Code picks it up. The benchmark has not been run on it: the last Opus it covered is \`$benched\`.

          1. Rerun the benchmark as \`bench/README.md\` describes, on this model and on the one before it.
          2. Record catch rate, findings that were not worth the time, and median minutes per review in \`docs/benchmark.md\`.
          3. If it reviews worse, pin the reviewer back to the previous model in \`plugins/design-harness/agents/ui-review.md\` and say why.
          4. Write \`$id\` into \`bench/opus-benchmarked.txt\`, which closes the loop for this release.
          EOF
          gh issue create --title "$title" --body-file body.md
